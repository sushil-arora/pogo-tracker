<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FF6B35" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="POGO Tracker" />
  <title>POGO Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #0a0a0f; overscroll-behavior: none; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulse  { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }
    @keyframes toastIn{ from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    .fade-in { animation: fadeIn 0.3s ease forwards; }
    input,select,textarea {
      background:#1a1a2a !important; border:1.5px solid #2a2a3a !important;
      color:#e8e8f0 !important; border-radius:8px !important; padding:8px 12px !important;
      font-family:inherit !important; font-size:14px !important; width:100%;
      outline:none !important; transition:border-color 0.2s; -webkit-appearance:none;
    }
    input:focus,select:focus,textarea:focus { border-color:#FF6B35 !important; }
    input::placeholder { color:#555 !important; }
    select option { background:#1a1a2a; }
    textarea { resize:vertical; }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:#FF6B35; border-radius:2px; }
    .btn-primary {
      background:linear-gradient(135deg,#FF6B35,#FF8C42); color:#fff; border:none;
      border-radius:10px; padding:10px 20px; font-family:inherit; font-weight:700;
      font-size:14px; cursor:pointer; letter-spacing:0.5px;
    }
    .social-chip {
      display:inline-flex; align-items:center; gap:4px;
      padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const VERSION = "1.1";

    const SCATTERBUG_PATTERNS = [
      "Icy Snow","Polar","Tundra","Continental","Garden","Elegant",
      "Meadow","Modern","Marine","Archipelago","High Plains","Sandstorm",
      "River","Monsoon","Savanna","Sun","Ocean","Jungle",
    ];
    const SOCIAL_PLATFORMS = [
      { id:"discord",   label:"Discord",   icon:"💬", color:"#5865F2" },
      { id:"twitter",   label:"Twitter/X", icon:"🐦", color:"#1DA1F2" },
      { id:"instagram", label:"Instagram", icon:"📸", color:"#E1306C" },
      { id:"facebook",  label:"Facebook",  icon:"👥", color:"#1877F2" },
      { id:"reddit",    label:"Reddit",    icon:"🤖", color:"#FF4500" },
      { id:"whatsapp",  label:"WhatsApp",  icon:"📱", color:"#25D366" },
      { id:"telegram",  label:"Telegram",  icon:"✈️", color:"#229ED9" },
    ];
    const defaultStats = {
      trainerName:"",trainerCode:"",level:"",xp:"",stardust:"",
      pokemonCaught:"",pokemonSeen:"",pokemonRegistered:"",
      kmWalked:"",eggsHatched:"",raidsBattled:"",raidsBattledLegendary:"",
      gymsVisited:"",pokestopsVisited:"",uniquePokestops:"",
      berryFed:"",greatThrows:"",excellentThrows:"",curveballs:"",
      evolutionsCompleted:"",pokemonPoweredUp:"",tradingDistance:"",
      friendsCount:"",giftsOpened:"",giftsSent:"",battlesWon:"",
      battleAttacks:"",megaEvolutions:"",shinyCaught:"",luckyPokemon:"",
      purifiedPokemon:"",shadowPokemon:"",rocketDefeated:"",gruntsDefeated:"",
      leaderDefeated:"",giovannisDefeated:"",waypointsSubmitted:"",waypointsApproved:"",
      hoursPlayed:"",totalKmBuddy:"",souvenirs:"",snapshots:"",
      dynamaxBattles:"",contestWins:"",
    };
    const statGroups = [
      { title:"Trainer Profile", icon:"🎮", color:"#FF6B35", fields:[
        {key:"trainerName",label:"Trainer Name",type:"text"},
        {key:"trainerCode",label:"Trainer Code",type:"text",placeholder:"0000 0000 0000"},
        {key:"level",label:"Level",type:"number"},
        {key:"xp",label:"Total XP",type:"number"},
        {key:"stardust",label:"Stardust",type:"number"},
      ]},
      { title:"Pokédex", icon:"📕", color:"#E53E3E", fields:[
        {key:"pokemonCaught",label:"Pokémon Caught",type:"number"},
        {key:"pokemonSeen",label:"Pokémon Seen",type:"number"},
        {key:"pokemonRegistered",label:"Pokédex Registered",type:"number"},
        {key:"shinyCaught",label:"Shiny Pokémon",type:"number"},
        {key:"luckyPokemon",label:"Lucky Pokémon",type:"number"},
      ]},
      { title:"Travel & Exploration", icon:"🗺️", color:"#38A169", fields:[
        {key:"kmWalked",label:"KM Walked",type:"number"},
        {key:"pokestopsVisited",label:"PokéStops Visited",type:"number"},
        {key:"uniquePokestops",label:"Unique PokéStops",type:"number"},
        {key:"gymsVisited",label:"Gyms Visited",type:"number"},
        {key:"waypointsSubmitted",label:"Waypoints Submitted",type:"number"},
        {key:"waypointsApproved",label:"Waypoints Approved",type:"number"},
      ]},
      { title:"Eggs & Hatching", icon:"🥚", color:"#D69E2E", fields:[
        {key:"eggsHatched",label:"Eggs Hatched",type:"number"},
      ]},
      { title:"Battles & Raids", icon:"⚔️", color:"#805AD5", fields:[
        {key:"raidsBattled",label:"Raids Battled",type:"number"},
        {key:"raidsBattledLegendary",label:"Legendary Raids",type:"number"},
        {key:"battlesWon",label:"Battles Won",type:"number"},
        {key:"battleAttacks",label:"Battle Attacks",type:"number"},
        {key:"dynamaxBattles",label:"Max/Dynamax Battles",type:"number"},
        {key:"contestWins",label:"Contest Wins",type:"number"},
      ]},
      { title:"Team GO Rocket", icon:"🚀", color:"#C53030", fields:[
        {key:"rocketDefeated",label:"Rocket Defeated (total)",type:"number"},
        {key:"gruntsDefeated",label:"Grunts Defeated",type:"number"},
        {key:"leaderDefeated",label:"Leaders Defeated",type:"number"},
        {key:"giovannisDefeated",label:"Giovanni Defeated",type:"number"},
        {key:"shadowPokemon",label:"Shadow Pokémon Rescued",type:"number"},
        {key:"purifiedPokemon",label:"Pokémon Purified",type:"number"},
      ]},
      { title:"Throws & Catching", icon:"🎯", color:"#2B6CB0", fields:[
        {key:"greatThrows",label:"Great Throws",type:"number"},
        {key:"excellentThrows",label:"Excellent Throws",type:"number"},
        {key:"curveballs",label:"Curveball Throws",type:"number"},
      ]},
      { title:"Pokémon Development", icon:"✨", color:"#00B5D8", fields:[
        {key:"evolutionsCompleted",label:"Evolutions Completed",type:"number"},
        {key:"pokemonPoweredUp",label:"Pokémon Powered Up",type:"number"},
        {key:"megaEvolutions",label:"Mega Evolutions",type:"number"},
        {key:"berryFed",label:"Berries Fed",type:"number"},
      ]},
      { title:"Social & Friends", icon:"🤝", color:"#F6AD55", fields:[
        {key:"friendsCount",label:"Friends",type:"number"},
        {key:"giftsOpened",label:"Gifts Opened",type:"number"},
        {key:"giftsSent",label:"Gifts Sent",type:"number"},
        {key:"tradingDistance",label:"Trading KM",type:"number"},
      ]},
      { title:"Buddy & Extras", icon:"🐾", color:"#68D391", fields:[
        {key:"totalKmBuddy",label:"Total KM with Buddy",type:"number"},
        {key:"souvenirs",label:"Souvenirs Collected",type:"number"},
        {key:"snapshots",label:"GO Snapshots",type:"number"},
        {key:"hoursPlayed",label:"Hours Played",type:"number"},
      ]},
    ];
    const defaultFriend = {name:"",ign:"",trainerCode:"",scatterbug:"",socials:{},notes:""};

    const AI_PROMPT = `You are analyzing a Pokémon GO screenshot. Extract every visible stat and return ONLY a valid JSON object (no markdown, no explanation).
Use exactly these keys if visible (omit keys not found):
trainerName, trainerCode, level, xp, stardust, pokemonCaught, pokemonSeen, pokemonRegistered,
kmWalked, eggsHatched, raidsBattled, raidsBattledLegendary, gymsVisited, pokestopsVisited,
uniquePokestops, berryFed, greatThrows, excellentThrows, curveballs, evolutionsCompleted,
pokemonPoweredUp, tradingDistance, friendsCount, giftsOpened, giftsSent, battlesWon,
battleAttacks, megaEvolutions, shinyCaught, luckyPokemon, purifiedPokemon, shadowPokemon,
rocketDefeated, gruntsDefeated, leaderDefeated, giovannisDefeated, waypointsSubmitted,
waypointsApproved, hoursPlayed, totalKmBuddy, souvenirs, snapshots, dynamaxBattles, contestWins.
All values must be strings. Strip commas from numbers. Return ONLY the JSON object.`;

    function useLocalStorage(key, initial) {
      const [val, setVal] = useState(() => {
        try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
        catch { return initial; }
      });
      useEffect(() => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }, [key, val]);
      return [val, setVal];
    }

    function ScatterSprite({ pattern }) {
      const colors = {
        "Icy Snow":"#A8D8EA","Polar":"#E8F4FD","Tundra":"#B8D4E8","Continental":"#C8E6C9",
        "Garden":"#A5D6A7","Elegant":"#F8BBD9","Meadow":"#DCEDC8","Modern":"#CFD8DC",
        "Marine":"#B3E5FC","Archipelago":"#80DEEA","High Plains":"#FFF9C4","Sandstorm":"#FFE0B2",
        "River":"#B2EBF2","Monsoon":"#90CAF9","Savanna":"#FFF59D","Sun":"#FFCC02",
        "Ocean":"#1565C0","Jungle":"#2E7D32",
      };
      return <span style={{display:"inline-block",width:20,height:20,borderRadius:"50%",background:colors[pattern]||"#333",border:"2px solid rgba(255,255,255,0.3)",verticalAlign:"middle",marginRight:6,flexShrink:0}} />;
    }

    async function readStatsFromImage(base64, mediaType) {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514", max_tokens:1000,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:mediaType,data:base64}},
            {type:"text",text:AI_PROMPT}
          ]}]
        })
      });
      const data = await res.json();
      const text = (data.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      return JSON.parse(text);
    }

    function ScanModal({ onClose, onApply, currentStats }) {
      const [queue, setQueue]         = useState([]);
      const [phase, setPhase]         = useState("queue");
      const [mergeMode, setMergeMode] = useState("merge");
      const [merged, setMerged]       = useState({});
      const [inputKey, setInputKey]   = useState(0);

      const readFile = (file) => new Promise((res,rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.onerror = () => rej();
        r.readAsDataURL(file);
      });

      const onFileChosen = async (e) => {
        const file = e.target.files && e.target.files[0];
        setInputKey(k => k+1);
        if (!file || !file.type.startsWith("image/")) return;
        const dataUrl = await readFile(file);
        setQueue(prev => [...prev, {id:Date.now()+Math.random(),file,dataUrl,status:"pending",result:null}]);
      };

      const removeItem = (id) => setQueue(prev => prev.filter(e=>e.id!==id));

      const startScan = async () => {
        if (!queue.length) return;
        setPhase("processing");
        let cur = queue.map(e=>({...e}));
        for (let i=0; i<cur.length; i++) {
          cur[i].status="scanning"; setQueue([...cur]);
          try {
            cur[i].result = await readStatsFromImage(cur[i].dataUrl.split(",")[1], cur[i].file.type);
            cur[i].status="done";
          } catch { cur[i].status="error"; }
          setQueue([...cur]);
        }
        const combined={};
        cur.filter(e=>e.status==="done").forEach(e=>Object.assign(combined,e.result));
        setMerged(combined); setPhase("review");
      };

      const applyStats = () => {
        if (mergeMode==="merge") {
          const out={...currentStats};
          Object.entries(merged).forEach(([k,v])=>{if(!out[k]&&v)out[k]=v;});
          onApply(out);
        } else { onApply({...currentStats,...merged}); }
        onClose();
      };

      const doneCount=queue.filter(e=>e.status==="done").length;
      const errCount=queue.filter(e=>e.status==="error").length;
      const totalFound=Object.keys(merged).length;
      const allFields=statGroups.flatMap(g=>g.fields);
      const scanning=queue.find(e=>e.status==="scanning");

      return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.93)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(6px)"}}
          onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div style={{background:"#0f0f1f",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:480,maxHeight:"93vh",overflow:"auto",padding:"20px 20px 50px",border:"1px solid #1e1e2e",borderBottom:"none"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
              <div>
                <div style={{fontWeight:900,fontSize:17,color:"#fff"}}>📸 Screenshot Import</div>
                <div style={{fontSize:11,color:"#666",marginTop:2}}>Add screenshots one by one, then scan all at once</div>
              </div>
              <button onClick={onClose} style={{background:"#1a1a2a",border:"1px solid #2a2a3a",color:"#aaa",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16}}>✕</button>
            </div>

            {phase==="queue" && (
              <>
                <label key={inputKey} style={{display:"flex",alignItems:"center",gap:14,width:"100%",padding:"16px 18px",borderRadius:14,cursor:"pointer",background:"linear-gradient(135deg,#1a1a3a,#2a1a4a)",border:"1.5px solid #4c1d95",marginBottom:14}}>
                  <span style={{width:48,height:48,borderRadius:12,flexShrink:0,background:"rgba(167,139,250,0.2)",border:"1px solid rgba(167,139,250,0.3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>📷</span>
                  <div style={{textAlign:"left"}}>
                    <div style={{fontWeight:800,fontSize:15,color:"#c4b5fd"}}>{queue.length===0?"Add Screenshot":"Add Another Screenshot"}</div>
                    <div style={{fontSize:12,color:"#7c5cbf",marginTop:2}}>{queue.length===0?"Tap here to pick a photo from your gallery":`${queue.length} image${queue.length>1?"s":""} queued — tap to add more`}</div>
                  </div>
                  <input type="file" accept="image/*" style={{display:"none"}} onChange={onFileChosen} />
                </label>

                {queue.length>0 && (
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:11,color:"#555",fontWeight:700,letterSpacing:0.5,marginBottom:8}}>QUEUED ({queue.length})</div>
                    {queue.map(item=>(
                      <div key={item.id} style={{display:"flex",alignItems:"center",gap:10,background:"#111120",borderRadius:12,padding:"10px 12px",border:"1px solid #1e1e2e",marginBottom:8}}>
                        <img src={item.dataUrl} alt="" style={{width:52,height:52,objectFit:"cover",borderRadius:8,flexShrink:0,border:"1px solid #2a2a3a"}} />
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,color:"#ccc",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.file.name}</div>
                          <div style={{fontSize:11,color:"#555",marginTop:2}}>{(item.file.size/1024).toFixed(0)} KB · Ready to scan</div>
                        </div>
                        <button onClick={()=>removeItem(item.id)} style={{background:"rgba(197,48,48,0.15)",border:"1px solid rgba(197,48,48,0.3)",color:"#FC8181",borderRadius:8,width:30,height:30,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>✕</button>
                      </div>
                    ))}
                  </div>
                )}

                {queue.length===0 && (
                  <div style={{padding:"18px 16px",background:"#0d0d1a",borderRadius:12,border:"1px dashed #1e1e2e",marginBottom:14}}>
                    <div style={{fontSize:12,color:"#555",lineHeight:1.9}}>
                      <div style={{fontWeight:700,color:"#666",marginBottom:4}}>💡 How to get your stats:</div>
                      <div>1. Open Pokémon GO → tap your avatar</div>
                      <div>2. Screenshot each stats page as you scroll</div>
                      <div>3. Come back here and tap <b style={{color:"#c4b5fd"}}>Add Screenshot</b></div>
                      <div>4. Tap <b style={{color:"#FF6B35"}}>Scan All</b> — AI fills everything in</div>
                    </div>
                  </div>
                )}

                <button onClick={startScan} disabled={queue.length===0} style={{width:"100%",padding:"14px",borderRadius:12,border:"none",cursor:queue.length===0?"not-allowed":"pointer",background:queue.length===0?"#1a1a2a":"linear-gradient(135deg,#FF6B35,#FF8C42)",color:queue.length===0?"#444":"#fff",fontWeight:800,fontSize:15,fontFamily:"inherit",letterSpacing:0.5}}>
                  {queue.length===0?"Add at least 1 screenshot to scan":`🔍 Scan ${queue.length} Screenshot${queue.length>1?"s":""}`}
                </button>
              </>
            )}

            {phase==="processing" && (
              <>
                <div style={{background:"#111120",borderRadius:12,padding:"14px 16px",marginBottom:14,border:"1px solid #1e1e2e"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <span style={{fontWeight:700,fontSize:14,color:"#fff"}}>Scanning {queue.length} screenshot{queue.length>1?"s":""}…</span>
                    <span style={{fontSize:13,color:"#FF6B35",fontWeight:700}}>{doneCount+errCount}/{queue.length}</span>
                  </div>
                  <div style={{height:5,background:"#1a1a2a",borderRadius:3}}>
                    <div style={{height:"100%",borderRadius:3,background:"linear-gradient(90deg,#FF6B35,#FFE066)",width:`${queue.length?((doneCount+errCount)/queue.length)*100:0}%`,transition:"width 0.5s ease"}} />
                  </div>
                  {scanning&&<div style={{fontSize:11,color:"#888",marginTop:6}}>🔍 Reading: {scanning.file.name}</div>}
                </div>
                {queue.map(item=>(
                  <div key={item.id} style={{display:"flex",alignItems:"center",gap:10,background:"#0d0d1a",borderRadius:12,padding:"10px 12px",border:`1px solid ${item.status==="done"?"rgba(104,211,145,0.25)":item.status==="error"?"rgba(252,129,129,0.25)":item.status==="scanning"?"rgba(255,224,102,0.2)":"#1a1a2a"}`,marginBottom:8}}>
                    <img src={item.dataUrl} alt="" style={{width:48,height:48,objectFit:"cover",borderRadius:8,flexShrink:0,opacity:item.status==="error"?0.3:1}} />
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,color:"#aaa",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.file.name}</div>
                      <div style={{fontSize:12,fontWeight:700,marginTop:3,color:item.status==="done"?"#68D391":item.status==="error"?"#FC8181":item.status==="scanning"?"#FFE066":"#555"}}>
                        {item.status==="pending"&&"⏳ Waiting…"}
                        {item.status==="scanning"&&"🔍 Scanning…"}
                        {item.status==="done"&&`✅ ${Object.keys(item.result||{}).length} stats found`}
                        {item.status==="error"&&"⚠️ Could not read"}
                      </div>
                    </div>
                    {item.status==="scanning"&&<div style={{display:"flex",gap:4}}>{[0,1,2].map(j=><div key={j} style={{width:5,height:5,borderRadius:"50%",background:"#FFE066",animation:`pulse 1.2s ease-in-out ${j*0.4}s infinite`}}/>)}</div>}
                  </div>
                ))}
              </>
            )}

            {phase==="review" && (
              <>
                <div style={{borderRadius:12,padding:"12px 16px",marginBottom:14,display:"flex",alignItems:"center",gap:12,background:totalFound>0?"rgba(56,161,105,0.1)":"rgba(197,48,48,0.1)",border:`1px solid ${totalFound>0?"rgba(56,161,105,0.3)":"rgba(197,48,48,0.3)"}`}}>
                  <span style={{fontSize:28}}>{totalFound>0?"✅":"⚠️"}</span>
                  <div>
                    <div style={{fontWeight:800,fontSize:14,color:totalFound>0?"#68D391":"#FC8181"}}>
                      {totalFound>0?`${totalFound} stats found across ${doneCount} image${doneCount>1?"s":""}`:"No stats could be read"}
                    </div>
                    <div style={{fontSize:11,color:"#666",marginTop:2}}>{errCount>0&&`${errCount} failed · `}{totalFound>0?"Choose import mode then apply":"Try clearer screenshots"}</div>
                  </div>
                </div>
                <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:6,marginBottom:14}}>
                  {queue.map(item=>(
                    <div key={item.id} style={{position:"relative",flexShrink:0}}>
                      <img src={item.dataUrl} alt="" style={{width:60,height:60,objectFit:"cover",borderRadius:10,border:`2px solid ${item.status==="done"?"#68D391":"#FC8181"}`,opacity:item.status==="error"?0.3:1}} />
                      <span style={{position:"absolute",top:-4,right:-4,fontSize:13}}>{item.status==="done"?"✅":"⚠️"}</span>
                    </div>
                  ))}
                </div>
                {totalFound>0&&(
                  <>
                    <div style={{marginBottom:12}}>
                      <div style={{fontSize:11,color:"#555",fontWeight:700,letterSpacing:0.5,marginBottom:8}}>IMPORT MODE</div>
                      <div style={{display:"flex",gap:8}}>
                        {[{id:"merge",label:"🔀 Merge",desc:"Only fill empty fields"},{id:"overwrite",label:"♻️ Overwrite",desc:"Replace all detected"}].map(m=>(
                          <button key={m.id} onClick={()=>setMergeMode(m.id)} style={{flex:1,padding:"10px",borderRadius:10,cursor:"pointer",textAlign:"left",border:`1.5px solid ${mergeMode===m.id?"#FF6B35":"#2a2a3a"}`,background:mergeMode===m.id?"rgba(255,107,53,0.12)":"#111120"}}>
                            <div style={{fontSize:13,fontWeight:700,color:mergeMode===m.id?"#FF6B35":"#aaa"}}>{m.label}</div>
                            <div style={{fontSize:10,color:"#666",marginTop:2}}>{m.desc}</div>
                          </button>
                        ))}
                      </div>
                    </div>
                    <div style={{background:"#0d0d1a",borderRadius:10,border:"1px solid #1e1e2e",maxHeight:200,overflow:"auto",marginBottom:14}}>
                      {Object.entries(merged).map(([key,val],i,arr)=>{
                        const field=allFields.find(f=>f.key===key);
                        const existing=currentStats[key];
                        const willChange=mergeMode==="overwrite"||!existing;
                        return (
                          <div key={key} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 12px",borderBottom:i<arr.length-1?"1px solid #1a1a2a":"none"}}>
                            <span style={{fontSize:12,color:"#aaa"}}>{field?.label||key}</span>
                            <div style={{display:"flex",alignItems:"center",gap:8}}>
                              {existing&&mergeMode==="overwrite"&&<span style={{fontSize:11,color:"#555",textDecoration:"line-through"}}>{existing}</span>}
                              <span style={{fontSize:12,fontWeight:700,fontFamily:"monospace",color:willChange?"#FFE066":"#555"}}>{val}</span>
                              {!willChange&&<span style={{fontSize:10,color:"#444"}}>skip</span>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </>
                )}
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>{setPhase("queue");setQueue([]);setMerged({});}} style={{flex:1,padding:"10px",borderRadius:10,background:"transparent",border:"1.5px solid #2a2a3a",color:"#aaa",cursor:"pointer",fontFamily:"inherit",fontSize:13}}>← Start Over</button>
                  {totalFound>0&&<button onClick={applyStats} style={{flex:2,padding:"12px",borderRadius:10,background:"linear-gradient(135deg,#FF6B35,#FF8C42)",color:"#fff",border:"none",fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>Apply {totalFound} Stats</button>}
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [tab,setTab]                     = useState("stats");
      const [stats,setStats]                 = useLocalStorage("pogo_stats_v2", defaultStats);
      const [friends,setFriends]             = useLocalStorage("pogo_friends", []);
      const [editingFriend,setEditingFriend] = useState(null);
      const [friendForm,setFriendForm]       = useState(defaultFriend);
      const [expandedGroup,setExpandedGroup] = useState("Trainer Profile");
      const [search,setSearch]               = useState("");
      const [showScan,setShowScan]           = useState(false);
      const [toast,setToast]                 = useState(null);

      const showToast = (msg,type="success") => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };
      const openAddFriend  = () => { setFriendForm({...defaultFriend,socials:{}}); setEditingFriend("new"); };
      const openEditFriend = (f,i) => { setFriendForm({...f,socials:{...f.socials}}); setEditingFriend(i); };
      const deleteFriend   = (i) => setFriends(friends.filter((_,idx)=>idx!==i));
      const saveFriend = () => {
        if (!friendForm.name&&!friendForm.ign) return;
        if (editingFriend==="new") setFriends([...friends,friendForm]);
        else setFriends(friends.map((f,i)=>i===editingFriend?friendForm:f));
        setEditingFriend(null);
      };
      const filteredFriends = friends.filter(f=>!search||f.name?.toLowerCase().includes(search.toLowerCase())||f.ign?.toLowerCase().includes(search.toLowerCase()));
      const filledCount = Object.values(stats).filter(Boolean).length;
      const totalCount  = Object.keys(defaultStats).length;

      return (
        <div style={{minHeight:"100vh",background:"#0a0a0f",fontFamily:"'Exo 2',sans-serif",color:"#e8e8f0",maxWidth:480,margin:"0 auto",position:"relative",paddingBottom:80}}>
          <style>{`@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&display=swap');`}</style>

          {toast&&<div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",background:toast.type==="success"?"rgba(56,161,105,0.95)":"rgba(197,48,48,0.95)",color:"#fff",padding:"10px 20px",borderRadius:12,fontSize:13,fontWeight:700,zIndex:300,whiteSpace:"nowrap",animation:"toastIn 0.3s ease",boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast.type==="success"?"✅":"⚠️"} {toast.msg}</div>}

          {/* Header */}
          <div style={{background:"linear-gradient(180deg,#0d0d1a 0%,#0a0a0f 100%)",borderBottom:"1px solid #1e1e2e",padding:"16px 20px 0",position:"sticky",top:0,zIndex:50}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
              <div style={{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,#FF6B35,#FF8C42)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>⚡</div>
              <div>
                <div style={{fontWeight:900,fontSize:18,letterSpacing:1,color:"#fff",lineHeight:1}}>
                  POGO <span style={{color:"#FF6B35"}}>TRACKER</span>
                  <span style={{fontSize:10,color:"#666",background:"#1a1a2a",border:"1px solid #2a2a3a",borderRadius:6,padding:"1px 6px",marginLeft:8,letterSpacing:0.5,verticalAlign:"middle"}}>v{VERSION}</span>
                </div>
                <div style={{fontSize:10,color:"#666",letterSpacing:2,textTransform:"uppercase"}}>{stats.trainerName||"Your Trainer"}</div>
              </div>
              {stats.level&&<div style={{marginLeft:"auto",background:"rgba(255,107,53,0.15)",border:"1px solid rgba(255,107,53,0.3)",borderRadius:8,padding:"4px 10px",textAlign:"center"}}><div style={{fontSize:10,color:"#FF6B35",letterSpacing:1}}>LVL</div><div style={{fontSize:18,fontWeight:900,color:"#FFE066",lineHeight:1}}>{stats.level}</div></div>}
            </div>
            <div style={{display:"flex"}}>
              {[{id:"stats",label:"📊 Stats"},{id:"friends",label:`👥 Friends${friends.length?` (${friends.length})`:""}`}].map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 0",background:"transparent",border:"none",borderBottom:tab===t.id?"2px solid #FF6B35":"2px solid transparent",color:tab===t.id?"#FF6B35":"#666",fontFamily:"inherit",fontWeight:700,fontSize:13,cursor:"pointer"}}>{t.label}</button>
              ))}
            </div>
          </div>

          {/* Stats Tab */}
          {tab==="stats"&&(
            <div className="fade-in">
              <div style={{margin:"12px 16px 4px",background:"linear-gradient(135deg,#1a1a3a,#120a2a)",border:"1px solid #2a1a5a",borderRadius:14,padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
                <div>
                  <div style={{fontWeight:800,fontSize:13,color:"#c4b5fd",marginBottom:3}}>📸 Screenshot Import <span style={{fontSize:10,background:"rgba(167,139,250,0.2)",padding:"1px 6px",borderRadius:4,marginLeft:4}}>v1.1</span></div>
                  <div style={{fontSize:11,color:"#666",lineHeight:1.5}}>Screenshot your stats → upload here → AI fills everything in</div>
                </div>
                <button onClick={()=>setShowScan(true)} style={{flexShrink:0,background:"linear-gradient(135deg,#1a1a3a,#2a1a4a)",border:"1.5px solid #4c1d95",borderRadius:10,padding:"10px 14px",cursor:"pointer",color:"#c4b5fd",fontFamily:"inherit",fontWeight:700,fontSize:13,display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:16}}>📷</span> Scan</button>
              </div>
              <div style={{padding:"8px 16px 4px"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:11,color:"#555"}}>Stats filled</span>
                  <span style={{fontSize:11,color:"#FF6B35",fontWeight:700}}>{filledCount} / {totalCount}</span>
                </div>
                <div style={{height:3,background:"#1a1a2a",borderRadius:2}}><div style={{height:"100%",borderRadius:2,background:"linear-gradient(90deg,#FF6B35,#FFE066)",width:`${(filledCount/totalCount)*100}%`,transition:"width 0.3s ease"}}/></div>
              </div>
              {statGroups.map(group=>(
                <div key={group.title} style={{marginBottom:4}}>
                  <button onClick={()=>setExpandedGroup(expandedGroup===group.title?null:group.title)} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"12px 20px",background:"transparent",border:"none",cursor:"pointer",textAlign:"left"}}>
                    <span style={{width:32,height:32,borderRadius:8,flexShrink:0,background:group.color+"22",border:`1px solid ${group.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{group.icon}</span>
                    <span style={{fontWeight:700,fontSize:14,color:"#e8e8f0",flex:1}}>{group.title}</span>
                    <span style={{fontSize:10,color:group.color,background:group.color+"22",padding:"2px 8px",borderRadius:20}}>{group.fields.filter(f=>stats[f.key]).length}/{group.fields.length}</span>
                    <span style={{color:"#555",fontSize:12}}>{expandedGroup===group.title?"▲":"▼"}</span>
                  </button>
                  {expandedGroup===group.title&&(
                    <div style={{padding:"0 20px 12px",borderBottom:"1px solid #1a1a2a"}}>
                      {group.fields.map(field=>(
                        <div key={field.key} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:8,marginBottom:2}}>
                          <label style={{flex:1,fontSize:13,color:"#aaa"}}>{field.label}</label>
                          <div style={{width:140,flexShrink:0}}>
                            <input type={field.type==="text"?"text":"number"} value={stats[field.key]||""} placeholder={field.placeholder||(field.type==="text"?"—":"0")} onChange={e=>setStats({...stats,[field.key]:e.target.value})} />
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* Friends Tab */}
          {tab==="friends"&&(
            <div className="fade-in" style={{padding:"16px"}}>
              <div style={{position:"relative",marginBottom:14}}>
                <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#555",fontSize:14}}>🔍</span>
                <input type="text" placeholder="Search friends..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:"36px!important"}} />
              </div>
              <button className="btn-primary" onClick={openAddFriend} style={{width:"100%",marginBottom:16,fontSize:15}}>+ Add Friend</button>
              {filteredFriends.length===0&&<div style={{textAlign:"center",padding:"40px 20px",color:"#555"}}><div style={{fontSize:40,marginBottom:8}}>👾</div><div style={{fontSize:14}}>{search?"No friends found":"No friends added yet"}</div></div>}
              {filteredFriends.map((f,i)=>(
                <div key={i} style={{background:"#111120",border:"1px solid #1e1e2e",borderRadius:14,padding:"14px 16px",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                    <div style={{width:42,height:42,borderRadius:12,flexShrink:0,background:"linear-gradient(135deg,#1e1e3a,#2a2a4a)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,border:"1.5px solid #2a2a4a"}}>{f.name?.[0]?.toUpperCase()||"?"}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:800,fontSize:15,color:"#fff"}}>{f.name||"—"}</div>
                      {f.ign&&<div style={{fontSize:12,color:"#FF6B35",fontWeight:600}}>IGN: {f.ign}</div>}
                      {f.trainerCode&&<div style={{fontSize:11,color:"#666",fontFamily:"monospace",marginTop:2}}>{f.trainerCode}</div>}
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      <button onClick={()=>openEditFriend(f,i)} style={{background:"transparent",border:"1.5px solid #2a2a3a",color:"#aaa",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:13}}>✏️</button>
                      <button onClick={()=>deleteFriend(i)} style={{background:"transparent",border:"1.5px solid #c53030",color:"#c53030",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:13}}>🗑️</button>
                    </div>
                  </div>
                  {f.scatterbug&&<div style={{display:"flex",alignItems:"center",marginTop:10,padding:"6px 10px",background:"#0d0d1a",borderRadius:8}}><ScatterSprite pattern={f.scatterbug}/><span style={{fontSize:12,color:"#aaa"}}>Scatterbug: </span><span style={{fontSize:12,color:"#FFE066",fontWeight:700,marginLeft:4}}>{f.scatterbug}</span></div>}
                  {Object.entries(f.socials||{}).filter(([,v])=>v).length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:10}}>{SOCIAL_PLATFORMS.filter(p=>f.socials?.[p.id]).map(p=><span key={p.id} className="social-chip" style={{background:p.color+"22",border:`1px solid ${p.color}44`,color:p.color}}>{p.icon} {f.socials[p.id]}</span>)}</div>}
                  {f.notes&&<div style={{marginTop:8,fontSize:12,color:"#777",fontStyle:"italic",padding:"6px 10px",background:"#0d0d1a",borderRadius:8}}>{f.notes}</div>}
                </div>
              ))}
            </div>
          )}

          {/* Friend Modal */}
          {editingFriend!==null&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={e=>e.target===e.currentTarget&&setEditingFriend(null)}>
              <div style={{background:"#0f0f1f",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:480,maxHeight:"90vh",overflow:"auto",padding:"20px 20px 40px",border:"1px solid #1e1e2e",borderBottom:"none"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
                  <div style={{fontWeight:900,fontSize:18,color:"#fff"}}>{editingFriend==="new"?"➕ Add Friend":"✏️ Edit Friend"}</div>
                  <button onClick={()=>setEditingFriend(null)} style={{background:"#1a1a2a",border:"1px solid #2a2a3a",color:"#aaa",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16}}>✕</button>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:12}}>
                  {[{key:"name",label:"REAL NAME",ph:"John Doe"},{key:"ign",label:"IN-GAME NAME (IGN)",ph:"PokéMaster99"},{key:"trainerCode",label:"TRAINER CODE",ph:"0000 0000 0000"}].map(f=>(
                    <div key={f.key}><label style={{fontSize:12,color:"#888",display:"block",marginBottom:4,letterSpacing:0.5}}>{f.label}</label><input type="text" value={friendForm[f.key]} placeholder={f.ph} onChange={e=>setFriendForm({...friendForm,[f.key]:e.target.value})} /></div>
                  ))}
                  <div><label style={{fontSize:12,color:"#888",display:"block",marginBottom:4,letterSpacing:0.5}}>SCATTERBUG PATTERN</label><select value={friendForm.scatterbug} onChange={e=>setFriendForm({...friendForm,scatterbug:e.target.value})}><option value="">Select pattern...</option>{SCATTERBUG_PATTERNS.map(p=><option key={p} value={p}>{p}</option>)}</select></div>
                  <div>
                    <label style={{fontSize:12,color:"#888",display:"block",marginBottom:8,letterSpacing:0.5}}>SOCIAL MEDIA HANDLES</label>
                    {SOCIAL_PLATFORMS.map(p=>(
                      <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                        <span style={{width:28,textAlign:"center",fontSize:16}}>{p.icon}</span>
                        <span style={{fontSize:12,color:"#888",width:70}}>{p.label}</span>
                        <input type="text" value={friendForm.socials?.[p.id]||""} placeholder="@username" onChange={e=>setFriendForm({...friendForm,socials:{...friendForm.socials,[p.id]:e.target.value}})} style={{flex:1}} />
                      </div>
                    ))}
                  </div>
                  <div><label style={{fontSize:12,color:"#888",display:"block",marginBottom:4,letterSpacing:0.5}}>NOTES</label><textarea value={friendForm.notes} placeholder="Trading partner, raid buddy..." rows={2} onChange={e=>setFriendForm({...friendForm,notes:e.target.value})} /></div>
                </div>
                <div style={{display:"flex",gap:10,marginTop:20}}>
                  <button onClick={()=>setEditingFriend(null)} style={{flex:1,padding:"10px",borderRadius:10,background:"transparent",border:"1.5px solid #2a2a3a",color:"#aaa",cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
                  <button className="btn-primary" onClick={saveFriend} style={{flex:2}}>{editingFriend==="new"?"Add Friend":"Save Changes"}</button>
                </div>
              </div>
            </div>
          )}

          {showScan&&<ScanModal currentStats={stats} onClose={()=>setShowScan(false)} onApply={(ns)=>{setStats(ns);const count=Object.keys(ns).filter(k=>ns[k]!==stats[k]&&ns[k]).length;showToast(`${count} stats imported!`);}} />}

          <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,height:4,background:"linear-gradient(90deg,#FF6B35,#FF8C42,#FFE066)",opacity:0.6}} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    // Register service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
